<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="A browser loads the single-page app from the public resume-web bucket and signs in to an OCI IAM identity domain with the authorization code flow and PKCE. It calls resume-gateway, a public API Gateway that validates the ID token against the domain's JWKS and sends all twenty routes to the resume-api function, which keeps rows in the resume_app NoSQL table and text and attachments in the private backend bucket. Submitting a job puts it on the resume-job-requests queue; four Connector Hub connectors, each with a batch size of one, invoke the resume-worker function, which fetches the posting, calls openai.gpt-oss-120b on OCI Generative AI to extract the job and score the resume, writes the analysis to the bucket, and records the status and token usage in NoSQL."><defs><marker id="a_e_page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_rows" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_enq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_wrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_fetch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_obj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs><rect width="1620" height="790" fill="#ffffff"/><path d="M600,95.0 H465" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_page)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">GET page</text><path d="M1020,95.0 H1155" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_auth)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">sign in</text><path d="M810.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_api)"/><text x="824.0" y="215.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">Bearer ID token</text><path d="M1020,295.0 H1155" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_fn)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">X-Route</text><path d="M1370.0,240 V195.0 H250.0 V235" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_rows)"/><text x="264.0" y="185.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">rows</text><path d="M1370.0,350 V435" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#a_e_enq)"/><text x="1384.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a6700" stroke="#ffffff" stroke-width="6" paint-order="stroke">POST /jobs</text><path d="M1160,495.0 H1025" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#a_e_read)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a6700" stroke="#ffffff" stroke-width="6" paint-order="stroke">read</text><path d="M600,495.0 H465" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_inv)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">invoke</text><path d="M250.0,440 V355" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_wrow)"/><text x="264.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">status, tokens</text><path d="M250.0,550 V635" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_fetch)"/><text x="264.0" y="630.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">fetch URL</text><path d="M330.0,550 V610.0 H810.0 V635" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_ai)"/><text x="824.0" y="630.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">chat</text><path d="M410.0,550 V580.0 H1370.0 V635" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_obj)"/><text x="1384.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">analysis</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Browser</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">SPA, PKCE login</text><rect x="40" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><g transform="translate(60,80.0) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g><text x="104.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">resume-web-&lt;hex&gt;</text><text x="104.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">public bucket (ObjectRead)</text><rect x="1160" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><g transform="translate(1180,80.0) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g><text x="1224.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Identity domain</text><text x="1224.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">resume-app, external users</text><rect x="40" y="240" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><g transform="translate(60,280.0) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3