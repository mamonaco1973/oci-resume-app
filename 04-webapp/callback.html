<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control"
        content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing in…</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #0f172a;
      color: #e5e7eb;
      padding: 16px;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
    }
    h2 { margin: 0 0 8px 0; font-size: 18px; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Signing you in…</h2>
    <div id="msg">Processing sign-in response…</div>
    <pre id="log"></pre>
  </div>

<!-- ============================================================================
     PKCE redirect handler.

     Uses the same auth.js the rest of the app does rather than re-implementing
     the token exchange inline, so the redirect URI, endpoint paths and storage
     keys can only ever be defined once. A second copy here is exactly how the
     redirect_uri drifts out of sync with the one registered on the app and
     every sign-in starts failing with an opaque invalid_grant.
============================================================================= -->
<script type="module">
import { CONFIG } from "./js/config.js";
import { exchangeCodeForTokens, storeTokens,
         getPostLoginRedirectUrl } from "./js/auth.js";

const elMsg = document.getElementById("msg");
const elLog = document.getElementById("log");

function log(msg) { elLog.textContent += msg + "\n"; }

function fail(msg) {
  elMsg.textContent = "Sign-in failed.";
  log("ERROR: " + msg);
  throw new Error(msg);
}

(async function main() {
  try {
    log("domainUrl = " + CONFIG.DOMAIN_URL);
    log("clientId  = " + CONFIG.CLIENT_ID);
    log("webBase   = " + CONFIG.WEB_BASE_URL);

    const url   = new URL(window.location.href);
    const code  = url.searchParams.get("code");
    const state = url.searchParams.get("state");
    const err   = url.searchParams.get("error");
    const errD  = url.searchParams.get("error_description");

    if (err)   fail(err + (errD ? " - " + errD : ""));
    if (!code) fail("Missing authorization code");

    // CSRF protection — the state we generated before redirecting must come
    // back untouched.
    const expectedState = sessionStorage.getItem("oauth_state");
    if (expectedState && state !== expectedState) fail("State mismatch");

    elMsg.textContent = "Exchanging authorization code for tokens…";

    const tokens = await exchangeCodeForTokens(code);

    // The SPA sends the ID token to API Gateway (aud = client_id), so its
    // absence is fatal even when the exchange itself reported success.
    if (!tokens.id_token) {
      fail("No id_token returned (request the 'openid' scope)");
    }

    storeTokens(tokens);

    // Strip code/state from the address bar so a refresh cannot replay them.
    window.history.replaceState({}, document.title, url.origin + url.pathname);

    elMsg.textContent = "Signed in. Redirecting…";
    log("Token exchange successful");
    window.location.href = getPostLoginRedirectUrl();
  } catch (e) {
    console.error(e);
  }
})();
</script>
</body>
</html>
