<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control"
        content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing in…</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #0f172a;
      color: #e5e7eb;
      padding: 16px;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
    }
    h2 { margin: 0 0 8px 0; font-size: 18px; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Signing you in…</h2>
    <div id="msg">Processing sign-in response…</div>
    <pre id="log"></pre>
  </div>

<script>
/* =============================================================================
   Helpers
============================================================================= */
const elMsg = document.getElementById("msg");
const elLog = document.getElementById("log");

function log(msg) { elLog.textContent += msg + "\n"; }

function fail(msg) {
  elMsg.textContent = "Sign-in failed.";
  log("ERROR: " + msg);
  throw new Error(msg);
}

/* =============================================================================
   Main — exchange the authorization code for tokens (PKCE, no client secret)
============================================================================= */
(async function main() {
  try {
    // Runtime config written by apply.sh (Identity Domains client + endpoints).
    // Relative path — the page is served under a long /o/ prefix, not the root.
    const cfgRes = await fetch("config.json", { cache: "no-store" });
    if (!cfgRes.ok) fail("Unable to load /config.json (" + cfgRes.status + ")");
    const cfg = await cfgRes.json();

    const { domainUrl, clientId, redirectUri } = cfg;
    if (!domainUrl || !clientId || !redirectUri) {
      fail("config.json missing domainUrl/clientId/redirectUri");
    }

    log("domainUrl   = " + domainUrl);
    log("clientId    = " + clientId);
    log("redirectUri = " + redirectUri);

    // Parse callback params.
    const url   = new URL(window.location.href);
    const code  = url.searchParams.get("code");
    const state = url.searchParams.get("state");
    const err   = url.searchParams.get("error");
    const errD  = url.searchParams.get("error_description");

    if (err)  fail(err + (errD ? " - " + errD : ""));
    if (!code) fail("Missing authorization code");

    // Validate state (CSRF protection).
    const expectedState = sessionStorage.getItem("oauth_state");
    if (expectedState && state !== expectedState) fail("State mismatch");

    // PKCE verifier stashed by the SPA before redirecting to authorize.
    const codeVerifier = sessionStorage.getItem("pkce_code_verifier");
    if (!codeVerifier) {
      fail("Missing PKCE code verifier. Login must be initiated by the SPA.");
    }

    elMsg.textContent = "Exchanging authorization code for tokens…";

    // Identity Domains token endpoint (note the /oauth2/v1/ path).
    const tokenUrl = domainUrl.replace(/\/$/, "") + "/oauth2/v1/token";

    const body = new URLSearchParams();
    body.set("grant_type", "authorization_code");
    body.set("client_id", clientId);
    body.set("code", code);
    body.set("redirect_uri", redirectUri);
    body.set("code_verifier", codeVerifier);

    const res  = await fetch(tokenUrl, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body
    });
    const text = await res.text();
    if (!res.ok) fail("Token endpoint error " + res.status + ": " + text);

    const tok = JSON.parse(text);
    // The SPA sends the ID token to the API Gateway (aud = client_id), so it is
    // the required token here; access_token is stored for completeness.
    if (!tok.id_token) fail("No id_token returned (request the 'openid' scope)");

    sessionStorage.setItem("id_token", tok.id_token);
    if (tok.access_token)  sessionStorage.setItem("access_token", tok.access_token);
    if (tok.refresh_token) sessionStorage.setItem("refresh_token", tok.refresh_token);
    if (tok.expires_in)    sessionStorage.setItem("expires_in", String(tok.expires_in));
    sessionStorage.setItem("token_received_at", String(Date.now()));

    // One-time values are no longer needed.
    sessionStorage.removeItem("pkce_code_verifier");
    sessionStorage.removeItem("oauth_state");

    // Strip the code/state from the address bar, then return to the SPA.
    window.history.replaceState({}, document.title, url.origin + url.pathname);
    elMsg.textContent = "Signed in. Redirecting…";
    log("Token exchange successful");
    window.location.href = url.origin + url.pathname.replace(/callback\.html$/, "index.html");
  } catch (e) {
    console.error(e);
  }
})();
</script>
</body>
</html>
